services:
  postgres:
    image: arm64v8/postgres:16-alpine
    container_name: dist-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: distribution_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-service:
    build:
      context: ./core-service
    container_name: dist-core-service
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=distribution_db
      - DB_USER=postgres
      - DB_PASS=postgrespassword
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    container_name: dist-api-gateway
    environment:
      - CoreService__BaseUrl=http://core-service:8080/api/v1/core/
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:5000"
    depends_on:
      - core-service

volumes:
  pgdata:
